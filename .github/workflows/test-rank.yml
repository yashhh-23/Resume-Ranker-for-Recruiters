name: Test standalone rank.py
on: [push, pull_request]
jobs:
  rank-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r backend/requirements.txt
      - name: Run rank.py smoke test
        working-directory: backend
        run: |
          python rank.py \
            --candidates ../data/sample_candidates.json \
            --jd ../data/job_description.txt \
            --out /tmp/test_submission.csv
      - run: python validate_submission.py --submission /tmp/test_submission.csv
