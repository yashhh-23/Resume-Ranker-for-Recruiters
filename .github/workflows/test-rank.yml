name: Test standalone rank.py
on: [push, pull_request]
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  rank-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r backend/requirements.txt
      - name: Run rank.py smoke test
        working-directory: backend
        run: |
          python rank.py \
            --candidates dataset/sample_candidates.json \
            --jd dataset/job_description.docx \
            --out /tmp/test_submission.csv
      - name: Validate submission
        working-directory: backend
        run: python dataset/validate_submission.py --submission /tmp/test_submission.csv
