  pre_computation_required: false
  pre_computation_time_minutes: 0

ai_tools_used:
  - "Claude"
  - "Cursor"
  - "Gemini"

ai_usage_summary: |
  Claude Sonnet 4.6 for UI development; Google Gemini & Perplexity for backend optimization and research. No candidate data was sent to external LLMs during scoring.

methodology_summary: |
  Unified two-stage additive ranking architecture featuring perfect mathematical symmetry between pre-filtering and detailed evaluation passes. Features automated contextual NLP skill token extraction, Gaussian experience curve window alignment, strict title domain masking to neutralize keyword stuffing, and an ascending alphanumerical candidate ID tie-breaker.

declarations:
  read_submission_spec: true
  code_is_original_work: true
  no_collusion: true
  reproduction_tested: true