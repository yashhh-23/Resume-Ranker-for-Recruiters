compute:
  platform: "Intel/AMD x86_64"
  cpu_cores: 8
  ram_gb: 16
  python_version: "3.11"
  os: "Windows/Linux"
  uses_gpu_for_inference: false
  has_network_during_ranking: false
  pre_computation_required: false
  pre_computation_time_minutes: 0

ai_tools_used:
  - "Claude Sonnet 4.6"
  - "Google Gemini"
  - "Perplexity"

ai_usage_summary: |
  Claude Sonnet 4.6 for UI development; Google Gemini & Perplexity for backend optimization and research. No candidate data was sent to external LLMs during scoring.

methodology_summary: |
  Deterministic 5-signal weighted ranker. JD is parsed into skills/title/industry/
  seniority/experience using regex + keyword matching. Candidates are scored across:
  Skill Match (35%), Career Fit (25%), Signal Modifier (15%), Education (15%),
  Availability (10%). Zero LLM inference in the scoring loop.
  Runtime ~2-5s for 1000 candidates on CPU.

declarations:
  read_submission_spec: true
  code_is_original_work: true
  no_collusion: true
  honeypot_check_done: true
  reproduction_tested: true