ai_tools_declaration: "Used Gemini and Perplexity AI for code review and architecture. Used Cursor for refactoring. No candidate data was fed to any LLM."
methodology_summary: |
  Deterministic 5-signal weighted ranker. JD is parsed into skills/title/industry/
  seniority/experience using regex + keyword matching. Candidates are scored across:
  Skill Match (35% — FAISS cosine + proficiency-weighted coverage),
  Career Fit (25% — recency-decayed title/industry match + seniority alignment),
  Signal Modifier (15% — Redrob activity signals),
  Education (15% — degree tier × field match),
  Availability (10% — notice period + open_to_work + relocation).
  Zero LLM inference in the scoring loop. Runtime ~2–5s for 1000 candidates on CPU.
declarations:
  read_submission_spec: true
  code_is_original_work: true
  no_collusion: true
  honeypot_check_done: true
  reproduction_tested: true
